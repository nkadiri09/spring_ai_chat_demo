# Groq API Configuration
# Groq is OpenAI-compatible, so we use the OpenAI starter pointed at Groq's base URL
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai
# spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.model=meta-llama/llama-4-maverick-17b-128e-instruct

# Optional: configure max tokens and temperature
spring.ai.openai.chat.options.max-tokens=1024
spring.ai.openai.chat.options.temperature=0.7

# Server port
server.port=8080

# Langfuse Configuration (LLM Observability without OpenTelemetry)
# Set these environment variables: LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY
langfuse.enabled=true
langfuse.public-key=${LANGFUSE_PUBLIC_KEY:}
langfuse.secret-key=${LANGFUSE_SECRET_KEY:}
langfuse.host=${LANGFUSE_HOST:https://us.cloud.langfuse.com}
