# Groq API Configuration
# Groq is OpenAI-compatible, so we use the OpenAI starter pointed at Groq's base URL
spring.ai.openai.api-key=${groq.api-key:}
spring.ai.openai.base-url=https://api.groq.com/openai
# spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.model=meta-llama/llama-4-maverick-17b-128e-instruct

# Optional: configure max tokens and temperature
spring.ai.openai.chat.options.max-tokens=1024
spring.ai.openai.chat.options.temperature=0.7

# Server port
server.port=8080


# ?? Spring AI Observability ???????????????????????????????????????????????????
# Enable tracing of chat model calls
spring.ai.chat.observations.include-prompt=true
spring.ai.chat.observations.include-completion=true

# ?? Actuator ??????????????????????????????????????????????????????????????????
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,metrics,tracing

# ?? OpenTelemetry -> Langfuse (local Docker) ??????????????????????????????????
# Langfuse OTLP endpoint (local Docker on port 3000)
otel.exporter.otlp.endpoint=http://localhost:3000/api/public/otel
# Basic auth: Base64("pk-lf-...:sk-lf-...")
otel.exporter.otlp.headers=Authorization=Basic ${LANGFUSE_AUTH_HEADER}
otel.exporter.otlp.protocol=http/protobuf
otel.service.name=chat-demo
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none


